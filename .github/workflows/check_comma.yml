name: Check CSV format comma validity

on:
  pull_request:
    branches:
      - develop

jobs:
  detect-changed-files:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.set-matrix.outputs.files }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Get changes
        id: set-matrix
        run: |
          git fetch origin develop
          #get all changed files between current head and base of branch (between PR and the base on develop)
          files=$(git --no-pager diff --name-only HEAD $(git merge-base HEAD origin/develop)\
            | jq -R -s -c 'split("\n")[:-1]')
          #-R read raw strings, -s get all lines, -c compact format, split on new lines to convert to array, ignore last empty line
          echo "$files"
          echo "files=$files" >> "$GITHUB_OUTPUT"

  check-comma:
    needs: detect-changed-files
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJson(needs.detect-changed-files.outputs.files) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Check comma in CSV
        run: python CSV/scripts/check_comma.py "${{ matrix.file }}"
